<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laporan Mutasi Rekening</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#d0d5dd;--ac:#1d4ed8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2127;--tx:#e8eaed;--mut:#9aa3ae;--bd:#363c45;--ac:#6b9bff}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2127;--tx:#e8eaed;--mut:#9aa3ae;--bd:#363c45;--ac:#6b9bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:56px;resize:vertical}
button{padding:9px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.tx{border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px;display:grid;grid-template-columns:90px 80px 1fr auto;gap:8px;align-items:start}
.tx .k{grid-column:1/4}.kk{display:flex;gap:8px}.kk>div:first-child{flex:0 0 40%}.kk>div:last-child{flex:1}
@media(max-width:560px){.tx{grid-template-columns:1fr 1fr}.tx .k{grid-column:1/3}}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.note{font-size:12px;color:var(--mut)}
#prev{display:flex;flex-direction:column;gap:14px;align-items:center;overflow-x:auto}
.pg{background:#fff;color:#000;width:794px;min-height:1123px;padding:40px 44px;font:500 11px/1.35 DM Sans,Arial,sans-serif;font-variant-numeric:tabular-nums;position:relative;box-shadow:0 1px 6px rgba(0,0,0,.25);flex:none}
.pg h2{font:800 20px DM Sans,Arial,sans-serif;text-align:center;margin:0 0 14px}
.hd{display:flex;gap:14px;margin-bottom:12px}
.bx{border:1.5px solid #000;border-radius:10px;padding:8px 12px;flex:1;font:800 12px DM Sans,Arial,sans-serif}
.bx table td{padding:3px 0;font:800 12px DM Sans,Arial,sans-serif}.bx table td:nth-child(1){width:112px}.bx table td:nth-child(2){width:30px}
.th,.rw{display:grid;grid-template-columns:76px 1fr 50px 140px 130px;column-gap:0}.rw>div,.th>div{padding:3px 6px}.th>div{white-space:nowrap}.th>div+div{border-left:1.5px solid #000}
.th{border:1.5px solid #000;border-radius:8px;font:800 13px DM Sans,Arial,sans-serif;padding:0;margin:10px 0 0;text-align:center}
.rw{padding:0 1.5px;white-space:pre-wrap}
.n{text-align:right}.kt{display:grid;grid-template-columns:140px 1fr;column-gap:8px;overflow-wrap:anywhere}
.ft{position:absolute;left:44px;right:44px;bottom:26px;font:11px Arial,sans-serif;color:#444;display:flex;justify-content:space-between}
.sum{width:330px;margin:18px auto 0}
.sum div{display:grid;grid-template-columns:110px 20px 150px 50px}
@media print{body{background:#fff}.wrap>*:not(#prevwrap){display:none}.wrap{padding:0;max-width:none}#prevwrap{border:0;padding:0}#prev{gap:0;display:block}.pg{box-shadow:none;page-break-after:always;margin:0}@page{size:A4;margin:0}}
</style></head><body><div class="wrap">
<h1>Laporan Mutasi Rekening</h1>
<div class="card"><div class="grid">
<div><label>Judul dokumen</label><input id="judul" value="LAPORAN MUTASI REKENING"></div>
<div><label>Nama pemilik</label><input id="nama"></div>
<div><label>Alamat (boleh banyak baris)</label><textarea id="alamat"></textarea></div>
<div><label>No. rekening</label><input id="norek"></div>
<div><label>Periode</label><input id="periode" placeholder="JUNI 2023"></div>
<div><label>Mata uang</label><input id="mata" value="IDR"></div>
<div><label>Saldo awal</label><input id="awal" type="number" step="0.01" value="0"></div>
<div><label>Transaksi per halaman (baris)</label><input id="cap" type="number" value="38"></div>
<div style="grid-column:1/-1"><label>Catatan (satu baris = satu poin, tampil di kotak CATATAN; kosongkan kalau tidak perlu)</label><textarea id="catatan" placeholder="Contoh: Mohon periksa laporan ini dan sampaikan keberatan paling lambat akhir bulan berikutnya."></textarea></div>
<div><label>Nama usaha / cabang (tampil di kiri atas)</label><input id="usaha" placeholder="GALAXY COMPUTER - DENPASAR"></div>
<div><label>Logo usaha Anda (gambar)</label><input id="lg" type="file" accept="image/*" onchange="setLogo(this.files[0])"><button onclick="noLogo()" style="margin-top:4px">Hapus logo</button></div>
</div></div>
<div class="card"><b>Transaksi</b>
<div id="list" style="margin-top:8px"></div>
<div class="bar"><button class="p" onclick="add()">+ Tambah transaksi</button><button onclick="clr()">Kosongkan</button></div>
<div class="note">Keterangan = judul transaksi (mis. TRSF E-BANKING DB). Rincian = baris di bawahnya (kode, nama, catatan). Saldo dihitung otomatis.</div></div>
<div class="bar"><button class="p" onclick="mkpdf()">Unduh PDF</button><button onclick="window.print()">Cetak</button><span id="st" class="note"></span></div>
<div class="card" id="prevwrap"><div id="prev"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var M=null;var S={h:{},tx:[]};var ids=["judul","nama","alamat","norek","periode","mata","awal","cap","catatan","usaha"];
function ld(){try{var s=localStorage.getItem("lm1");if(s)S=JSON.parse(s)}catch(e){}
ids.forEach(function(i){if(S.h[i]!=null)document.getElementById(i).value=S.h[i]});if(!S.u1){var ue=document.getElementById("usaha");if(!ue.value)ue.value="GALAXY COMPUTER";S.u1=1}S.tx.forEach(function(x){if(x.r==null){var a=(x.k||"").split("\n");x.k=a[0];x.r=a.slice(1).join("\n")}});if(!S.tx.length)S.tx.push({t:"",k:"",j:"CR",n:""})}
function sv(){ids.forEach(function(i){S.h[i]=document.getElementById(i).value});try{localStorage.setItem("lm1",JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function fmt(n){return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function list(){var h="";S.tx.forEach(function(x,i){h+='<div class="tx"><div><label>Tanggal</label><input value="'+esc(x.t)+'" placeholder="01/06" oninput="up('+i+',\'t\',this.value)"></div><div><label>Jenis</label><select onchange="up('+i+',\'j\',this.value)"><option'+(x.j=="CR"?" selected":"")+'>CR</option><option'+(x.j=="DB"?" selected":"")+'>DB</option></select></div><div><label>Nominal</label><input type="number" step="0.01" value="'+esc(x.n)+'" oninput="up('+i+',\'n\',this.value)"></div><div><label>&nbsp;</label><button onclick="del('+i+')">Hapus</button></div><div class="k kk"><div><label>Keterangan</label><input value="'+esc(x.k)+'" placeholder="TRSF E-BANKING DB" oninput="up('+i+',\'k\',this.value)"></div><div><label>Rincian (satu baris satu rincian)</label><textarea oninput="up('+i+',\'r\',this.value)">'+esc(x.r||"")+'</textarea></div></div></div>'});
document.getElementById("list").innerHTML=h}
function up(i,f,v){S.tx[i][f]=v;draw()}
function add(){S.tx.push({t:"",k:"",j:"DB",n:""});list();draw()}
function del(i){S.tx.splice(i,1);list();draw()}
function clr(){if(confirm("Hapus semua transaksi?")){S.tx=[{t:"",k:"",j:"CR",n:""}];list();draw()}}
function draw(){sv();var g=function(i){return document.getElementById(i).value};
var cap=Math.max(10,+g("cap")||38),saldo=+g("awal")||0,cr=0,db=0,ncr=0,ndb=0,awal=saldo;
var rows=[{l:1,h:'<div class="rw"><div></div><div>SALDO AWAL</div><div></div><div></div><div class="n">'+fmt(awal)+'</div></div>',d:["","SALDO AWAL","",fmt(awal)]}];
S.tx.forEach(function(x,i){var n=+x.n||0;if(!x.t&&!n&&!x.k)return;
if(x.j=="CR"){saldo+=n;cr+=n;ncr++}else{saldo-=n;db+=n;ndb++}
var nx=S.tx[i+1],last=!nx||nx.t!=x.t;var ls=(x.r||"").split("\n");var det=ls.slice(1).join("\n");
var sd=last?fmt(saldo):"";
rows.push({d:[x.t||"",x.k||"",fmt(n)+(x.j=="DB"?" DB":""),sd,x.r||""],l:Math.max(1,ls.length),h:'<div class="rw"><div>'+esc(x.t)+'</div><div class="kt"><span>'+esc(x.k||"")+'</span><span>'+esc(x.r||"")+'</span></div><div></div><div class="n">'+fmt(n)+(x.j=="DB"?" DB":"")+'</div><div class="n">'+sd+'</div></div>'})});
var pages=[],cur=[],u=0;rows.forEach(function(r){if(u+r.l>cap&&cur.length){pages.push(cur);cur=[];u=0}cur.push(r);u+=r.l});if(cur.length)pages.push(cur);
var out="",tot=pages.length;var cn=g("catatan").trim().split("\n").filter(Boolean);var cat=cn.length?'<div class="bx" style="font:400 10px DM Sans,Arial,sans-serif;margin-bottom:6px"><div style="margin-bottom:3px">CATATAN:</div><ul style="margin:0;padding-left:14px;columns:2;column-gap:24px">'+cn.map(function(l){return "<li>"+esc(l)+"</li>"}).join("")+'</ul></div>':"";
pages.forEach(function(p,pi){var al=esc(g("alamat")).replace(/\n/g,"<br>");
out+='<div class="pg"><div style="position:relative;display:flex;align-items:center;justify-content:center;min-height:'+(S.logo?56:30)+'px;margin-bottom:4px">'+(S.logo?'<img src="'+S.logo+'" style="position:absolute;left:0;top:0;max-height:50px;max-width:130px">':'')+'<h2 style="margin:0">'+esc(g("judul"))+'</h2></div><div style="font:800 12px DM Sans,Arial,sans-serif;margin-bottom:6px">'+esc(g("usaha"))+'</div><div class="hd"><div class="bx"><b>'+esc(g("nama"))+'</b><br>'+al+'</div><div class="bx"><table><tr><td>NO. REKENING</td><td>:</td><td>'+esc(g("norek"))+'</td></tr><tr><td>HALAMAN</td><td>:</td><td>'+(pi+1)+'/'+tot+'</td></tr><tr><td>PERIODE</td><td>:</td><td>'+esc(g("periode"))+'</td></tr><tr><td>MATA UANG</td><td>:</td><td>'+esc(g("mata"))+'</td></tr></table></div></div>'+cat+'<div class="th"><div>TANGGAL</div><div>KETERANGAN</div><div>CBG</div><div>MUTASI</div><div>SALDO</div></div>'+p.map(function(r){return r.h}).join("");
if(pi<tot-1)out+='<div style="position:absolute;right:44px;bottom:26px;font-style:italic">Bersambung ke halaman berikutnya</div>';
else out+='<div class="sum"><div><span>SALDO AWAL</span><span>:</span><span class="n">'+fmt(awal)+'</span></div><div><span>MUTASI CR</span><span>:</span><span class="n">'+fmt(cr)+'</span><span class="n">'+ncr+'</span></div><div><span>MUTASI DB</span><span>:</span><span class="n">'+fmt(db)+'</span><span class="n">'+ndb+'</span></div><div><span>SALDO AKHIR</span><span>:</span><span class="n">'+fmt(saldo)+'</span></div></div>';
out+='<div class="ft"><span>Dokumen internal, bukan dokumen resmi bank</span></div></div>'});
M={pages:pages,awal:awal,cr:cr,db:db,ncr:ncr,ndb:ndb,saldo:saldo};document.getElementById("prev").innerHTML=out}
ids.forEach(function(i){document.getElementById(i).addEventListener("input",draw)});
async function mkpdf(){var st=document.getElementById("st");
if(!M||!window.jspdf){st.textContent="Pustaka PDF belum termuat.";return}
var d=new window.jspdf.jsPDF({unit:"pt",format:"a4"}),g=function(i){return document.getElementById(i).value},tot=M.pages.length,LH=11.5;
M.pages.forEach(function(p,pi){if(pi)d.addPage();
d.setTextColor(0);d.setFont("helvetica","bold");d.setFontSize(15);d.text(g("judul"),297.5,60,{align:"center"});
if(S.logo){try{var ip=d.getImageProperties(S.logo),sc=Math.min(120/ip.width,40/ip.height);d.addImage(S.logo,ip.fileType,33,24,ip.width*sc,ip.height*sc)}catch(e){}}
d.setFontSize(9);d.text(g("usaha"),33,72);
d.setLineWidth(1);d.roundedRect(33,78,270,86,7,7);d.roundedRect(313,78,249,86,7,7);
d.setFontSize(9);d.setFont("helvetica","bold");d.text(g("nama"),43,94);d.setFont("helvetica","bold");
g("alamat").split("\n").slice(0,5).forEach(function(l,i){d.text(l,43,106+12*i)});
d.setFont("helvetica","bold");d.setFontSize(9);[["NO. REKENING",g("norek")],["HALAMAN",(pi+1)+"/"+tot],["PERIODE",g("periode")],["MATA UANG",g("mata")]].forEach(function(r,i){d.text(r[0],323,98+i*17);d.text(":",392,98+i*17);d.text(r[1],410,98+i*17)});
var cl=g("catatan").trim().split("\n").filter(Boolean),oy=0;
if(cl.length){d.setFont("helvetica","normal");d.setFontSize(7.5);var its=cl.map(function(l){return d.splitTextToSize("\u2022 "+l,240)}),hf=Math.ceil(its.length/2),cb=196;
[[its.slice(0,hf),43],[its.slice(hf),305]].forEach(function(c){var yy=196;c[0].forEach(function(ls){ls.forEach(function(t){d.text(t,c[1],yy);yy+=9.5})});if(yy>cb)cb=yy});
d.setFont("helvetica","normal");d.setFontSize(7.5);d.text("CATATAN:",43,184);var h=cb-172+2;d.roundedRect(33,172,529,h,6,6);oy=h+2}
d.setFont("helvetica","bold");d.roundedRect(33,176+oy,529,22,6,6);d.setFontSize(10);d.text("TANGGAL",61,191+oy,{align:"center"});d.text("KETERANGAN",195,191+oy,{align:"center"});d.text("CBG",325,191+oy,{align:"center"});d.text("MUTASI",405,191+oy,{align:"center"});d.text("SALDO",508,191+oy,{align:"center"});
d.setFont("helvetica","normal");d.setFontSize(8.5);var y=218+oy;
p.forEach(function(r){d.text(r.d[0],40,y);d.text(r.d[1],95,y);(r.d[4]||"").split("\n").forEach(function(l,i){d.text(l,192,y+i*LH)});d.text(r.d[2],450,y,{align:"right"});d.text(r.d[3],555,y,{align:"right"});y+=r.l*LH+3});d.setLineWidth(1);[90,300,350,455].forEach(function(x){d.line(x,176+oy,x,198+oy)});
if(pi<tot-1){d.setFont("helvetica","italic");d.text("Bersambung ke halaman berikutnya",562,812,{align:"right"})}
else{y+=16;var s=[["SALDO AWAL",M.awal,""],["MUTASI CR",M.cr,M.ncr],["MUTASI DB",M.db,M.ndb],["SALDO AKHIR",M.saldo,""]];s.forEach(function(r,i){d.text(r[0],180,y+i*LH);d.text(":",248,y+i*LH);d.text(fmt(r[1]),380,y+i*LH,{align:"right"});d.text(String(r[2]),415,y+i*LH,{align:"right"})})}
d.setFont("helvetica","normal");d.setFontSize(8);d.text("Dokumen internal, bukan dokumen resmi bank",33,812);});
try{var dl=await claude.use("downloads");if(!dl){st.textContent="Unduh tidak tersedia di tampilan ini. Coba buka artifact langsung di claude.ai.";return}
await dl.save({filename:"laporan-mutasi-"+(g("periode")||"x").trim().replace(/\s+/g,"-")+".pdf",data:d.output("blob")});st.textContent="PDF tersimpan."}catch(e){st.textContent=(e&&e.code=="declined")?"Dibatalkan.":"Gagal: "+((e&&e.message)||e)}}
function setLogo(f){if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,300/im.width,120/im.height),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.logo=c.toDataURL("image/png");draw()};im.src=r.result};r.readAsDataURL(f)}
function noLogo(){S.logo="";document.getElementById("lg").value="";draw()}
ld();list();draw();
</script></body></html>
